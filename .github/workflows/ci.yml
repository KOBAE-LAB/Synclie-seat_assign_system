# CI: PR ごと・main への push ごとに lint / 型チェック / テスト / ビルドを実行する。
# ジョブ名 "ci" はブランチ保護の必須チェックと、サーバー側の自動更新
# （deploy/auto-update.sh が check-runs API で success を確認）の両方で参照しているので変更しないこと。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # 自動更新スクリプトの検査（shellcheck は ubuntu-latest に同梱）
      - name: deploy スクリプトの検査
        run: |
          bash -n deploy/auto-update.sh deploy/test-auto-update.sh
          shellcheck deploy/*.sh
          bash deploy/test-auto-update.sh
